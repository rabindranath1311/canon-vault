<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Canon Clip</title>
  <link rel="stylesheet" href="styles.css">
  <style>body { width: 344px; }</style>
</head>
<body>
  <header class="head">
    <svg class="mark" viewBox="0 0 144 100" fill="currentColor" aria-hidden="true">

    </svg>
    <h1 class="grow">Canon Clip</h1>
    <button id="vault-chip" class="chip" title="Vault settings">…</button>
  </header>

  <main class="pad">
    <section class="card">
      <div class="preview">
        <img id="thumb" alt="" hidden>
        <div class="grow stack">
          <div id="page-title" class="truncate" style="font-weight:600"></div>
          <div id="page-host" class="tiny muted truncate"></div>
        </div>
      </div>
      <div class="card-pad stack" style="border-top:1px solid var(--i-1)">
        <label class="field">Caption
          <input id="caption" type="text" placeholder="what caught your eye…">
        </label>
        <label class="field">Tags
          <input id="tags" type="text" placeholder="#ui #navigation">
        </label>
        <label class="field">Wall
          <input id="wall" type="text" list="walls" placeholder="Interface Inspiration">
        </label>
        <datalist id="walls"></datalist>
      </div>
    </section>

    <div class="row between">
      <span class="tiny muted">A page or a link becomes</span>
      <span class="seg" id="target">
        <button data-target="bookmark">a bookmark</button>
        <button data-target="wall">a wall card</button>
      </span>
    </div>

    <div class="actions">
      <button id="clip-page" class="primary">Clip page</button>
      <button id="clip-region">Region</button>
      <button id="clip-screen">Screen</button>
    </div>
    <div class="actions">
      <button id="clip-selection" class="ghost tiny">Clip selection</button>
      <button id="clip-og" class="ghost tiny">Clip page image</button>
    </div>

    <p id="status" class="status" role="status"></p>

    <section id="queue-box" class="card hidden">
      <div class="card-pad row between">
        <h2 id="queue-title">Waiting</h2>
        <button id="flush" class="tiny">Save now</button>
      </div>
      <div id="queue" class="list"></div>
    </section>

    <section id="recent-box" class="card hidden">
      <div class="card-pad"><h2>Just saved</h2></div>
      <div id="recent" class="list"></div>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
