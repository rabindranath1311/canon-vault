  <!-- A favicon is loaded standalone, so it cannot inherit currentColor from
       the page. The ink flips on the OS/browser scheme instead — otherwise
       near-black vanishes against dark browser chrome.

       The colour is a custom property applied to the PATH, never to a group:
       a CSS `fill` declaration outranks the `fill="none"` presentation
       attribute on the root, so setting it group-wide fills every shape and
       collapses the C into a solid disc. -->
